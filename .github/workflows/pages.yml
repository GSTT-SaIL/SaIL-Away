# Publishes the board to GitHub Pages on every push to main.
#
# Only the site's own files are published - the pages, css/, js/, assets/
# and public/ - copied into a fresh folder, so docs, tests, tools and the
# Supabase project files never reach the web server (the old nginx
# allowlist's job). A new top-level page or folder must be added here.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site's files
        run: |
          mkdir _site
          cp index.html availability.html form.html styleguide.html 404.html _site/
          cp -r css js assets public _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
